<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy — Holeshot BMX</title>
  <meta name="description" content="Privacy Policy for the Holeshot BMX app.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://holeshotbmx.com.au/privacy/">
  <link rel="icon" type="image/png" href="../newIcon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D1116;
      --orange:    #FF6A00;
      --teal:      #18B2A6;
      --deep-teal: #0E5A5B;
      --white:     #FFFFFF;
      --muted:     rgba(255,255,255,0.55);
      --border:    rgba(255,255,255,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    /* ─── HEADER ── */
    .site-header {
      background: rgba(13,17,22,0.95);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-logo {
      height: 36px;
      width: auto;
    }

    .back-link {
      font-size: 13px;
      color: var(--teal);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--orange); }

    /* ─── MAIN ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ─── DOC META ── */
    .doc-meta {
      border-left: 3px solid var(--orange);
      padding: 12px 18px;
      background: rgba(255,106,0,0.06);
      border-radius: 0 8px 8px 0;
      margin-bottom: 40px;
      font-size: 14px;
      color: var(--muted);
    }
    .doc-meta strong { color: var(--white); }

    /* ─── LOADING / ERROR ── */
    .state-box {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
    }
    .state-box .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── MARKDOWN CONTENT ── */
    .doc-content h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.05;
      margin-bottom: 32px;
      color: var(--white);
    }

    .doc-content h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--orange);
      margin: 40px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .doc-content h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--teal);
      margin: 28px 0 8px;
    }

    .doc-content p {
      color: rgba(255,255,255,0.75);
      margin-bottom: 16px;
    }

    .doc-content ul, .doc-content ol {
      color: rgba(255,255,255,0.75);
      padding-left: 20px;
      margin-bottom: 16px;
    }

    .doc-content li { margin-bottom: 6px; }

    .doc-content strong { color: var(--white); font-weight: 600; }

    .doc-content a { color: var(--teal); text-decoration: none; }
    .doc-content a:hover { color: var(--orange); text-decoration: underline; }

    .doc-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .doc-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .doc-content th {
      background: rgba(255,106,0,0.10);
      color: var(--white);
      font-weight: 600;
      text-align: left;
      padding: 10px 14px;
      border: 1px solid var(--border);
    }

    .doc-content td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      color: rgba(255,255,255,0.7);
    }

    .doc-content tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    blockquote {
      border-left: 3px solid var(--teal);
      padding: 10px 16px;
      margin: 16px 0;
      background: rgba(24,178,166,0.05);
      border-radius: 0 6px 6px 0;
      color: var(--muted);
    }

    code {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: monospace;
    }

    /* ─── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 24px;
      text-align: center;
    }
    .footer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.3);
    }
    .footer-inner a { color: var(--teal); text-decoration: none; }
    .footer-inner a:hover { color: var(--orange); }

    @media (max-width: 600px) {
      main { padding: 32px 16px 60px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/">
      <img src="../logo.png" alt="Holeshot BMX" class="header-logo">
    </a>
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to home
    </a>
  </div>
</header>

<main>
  <div id="loading" class="state-box">
    <div class="spinner"></div>
    <p>Loading Privacy Policy…</p>
  </div>

  <div id="error" class="state-box" style="display:none">
    <p>Unable to load the Privacy Policy. Please try again later or contact <a href="mailto:admin@holeshotbmx.com.au" style="color:var(--teal)">admin@holeshotbmx.com.au</a></p>
  </div>

  <div id="doc" style="display:none">
    <div class="doc-meta" id="meta"></div>
    <div class="doc-content" id="content"></div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>© 2026 Holeshot BMX</span>
    <a href="/privacy/">Privacy Policy</a>
    <a href="/terms/">Terms of Service</a>
    <a href="/">holeshotbmx.com.au</a>
  </div>
</footer>

<script>
  const SUPA_URL = 'https://jnomyhzrkixfjxhfsywa.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impub215aHpya2l4Zmp4aGZzeXdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzQxMDcsImV4cCI6MjA5NDIxMDEwN30.TSEogLWMkS_qpZCsdld7FBBYiYFoE-eXzmSg3A0zVyI';

  async function load() {
    try {
      const res = await fetch(
        `${SUPA_URL}/rest/v1/legal_documents?doc_type=eq.privacy&is_published=eq.true&select=title,content_md,effective_date,version`,
        { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
      );
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      if (!data.length) throw new Error('Not found');

      const doc = data[0];
      const date = doc.effective_date
        ? new Date(doc.effective_date).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' })
        : null;

      document.getElementById('meta').innerHTML =
        `<strong>${doc.title || 'Privacy Policy'}</strong>${date ? ` &nbsp;·&nbsp; Effective ${date}` : ''}${doc.version ? ` &nbsp;·&nbsp; Version ${doc.version}` : ''}`;

      document.getElementById('content').innerHTML = marked.parse(doc.content_md || '');
      document.title = `${doc.title || 'Privacy Policy'} — Holeshot BMX`;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('doc').style.display = 'block';
    } catch {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }
  }

  load();
</script>

</body>
</html>
